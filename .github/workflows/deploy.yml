name: Deploy to Hetzner

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      app_port:
        required: false
        type: string
        default: '80'
      domain:
        required: false
        type: string
        default: 'meghd.space'
      dockerfile_path:
        required: false
        type: string
        default: './Dockerfile'
      docker_build_args:
        required: false
        type: string
        default: ''
      docker_run_args:
        required: false
        type: string
        default: ''
      spa_mode:
        required: false
        type: boolean
        default: true
      skip_release:
        required: false
        type: boolean
        default: false
      environment:
        required: false
        type: string
        default: 'production'
    secrets:
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_HOST:
        required: true

concurrency:
  group: deploy-${{ inputs.app_name }}-${{ inputs.environment }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: true

env:
  SSH_CMD: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - name: Debug context
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "App: ${{ inputs.app_name }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "PR number: ${{ github.event.pull_request.number || 'N/A' }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Show environment
        run: |
          echo "Will deploy ${{ inputs.app_name }} to ${{ inputs.environment }} on ${{ secrets.DEPLOY_HOST }}"